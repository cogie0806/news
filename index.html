<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 💡 スマホ表示を最適化する（レスポンシブ対応）タグを追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cogie0806ニュース</title>
    
    <!-- 💡 アイコン設定を正しい位置（styleの外）に移動し、ファイルを指定 -->
    <link rel="icon" href="cogie0806.jpg" type="image/jpeg">

    <style>
        /* 💡 スマホの画面幅からはみ出さないように基本設定を調整 */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }
        
        /* 💡 リンクボタンのデザイン */
        .link-btn {
            display: block;
            text-align: center;
            background-color: #10b981; 
            color: white;
            text-decoration: none; 
            padding: 12px; /* スマホでタップしやすいように少し太くしました */
            margin: 8px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .link-btn:hover {
            background-color: #059669; 
        }
        .ai-btn {
            background-color: #3b82f6;
        }
        .ai-btn:hover {
            background-color: #2563eb;
        }
        .news-box {
            padding: 15px; /* スマホで見やすい余白に調整 */
            border: 1px solid #ccc;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            word-wrap: break-word; /* 長いテキストの自動改行対応 */
        }
    </style>
</head>
<body>

    <h1>cogie0806ニュース</h1>
    <div class="nav-bar">
        <a class="link-btn ai-btn" href="https://cogie0806.github.io/" target="_blank">ホームページへ戻る</a>
    </div>

    <h2>ニュース１</h2>
    <div id="news1" class="news-box">読み込み中...</div>

    <h2>ニュース２</h2>
    <div id="news2" class="news-box">読み込み中...</div>
    
    <h2>ニュース3</h2>
    <div id="news3" class="news-box">読み込み中...</div>

    <script>
        // テキストファイルを読み込んで表示する関数
        function loadNews(file, elementId) {
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('ファイルが見つかりません');
                    return response.text();
                })
                .then(data => {
                    document.getElementById(elementId).innerText = data;
                })
                .catch(error => {
                    document.getElementById(elementId).innerText = "ニュースの読み込みに失敗しました。";
                });
        }

        // 実行（ニュース1〜3のすべてを読み込み）
        loadNews('news1.txt', 'news1');
        loadNews('news2.txt', 'news2');
        loadNews('news3.txt', 'news3');
    </script>

</body>
</html>
